name: Picnic MCP
version: "0.1.0"
slug: picnic-mcp
description: Picnic boodschappen (zoeken, aanbiedingen, winkelmandje) als MCP-server voor Claude
url: https://github.com/rubenhartong/Picnic-mcp
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
watchdog: http://[HOST]:[PORT:8099]/health
ports:
  8099/tcp: null
ports_description:
  8099/tcp: MCP gateway (alleen nodig als je hem op je LAN wilt openzetten)
options:
  picnic_username: ""
  picnic_password: ""
  country_code: NL
  blocked_tools:
    - picnic_cancel_delivery
    - picnic_set_delivery_slot
    - picnic_clear_cart
    - picnic_send_delivery_invoice_email
    - picnic_get_payment_profile
    - picnic_get_wallet_transactions
    - picnic_get_wallet_transaction_details
    - picnic_save_recipe
    - picnic_unsave_recipe
schema:
  picnic_username: email
  picnic_password: password
  country_code: list(NL|DE|FR)
  auth_token: password?
  blocked_tools:
    - str
